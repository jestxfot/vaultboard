# Релиз: на тег vX.Y.Z (его ставит npm run release) собираем установщики на Windows и Linux
# и выкладываем их в релиз GitHub — вместе с latest*.yml и .blockmap, по которым приложение обновляется само.
# Запуск вручную (Actions → Релиз → Run workflow) только собирает, без релиза: проверить сборку и прогреть кэш.
name: Релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron и инструменты electron-builder (NSIS, 7-Zip, AppImage) — не скачивать заново каждый раз.
      # Ключ — package-lock.json: обновили Electron или electron-builder — кэш соберётся заново.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Только собрать: выкладывает один общий шаг ниже, когда готовы обе системы.
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    # Релиз — только на тег; ручной запуск лишь собирает.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Релиз с установщиками
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Что нового — заголовки коммитов с прошлого релиза.
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1)
          {
            echo '## Что нового'
            echo
            git log --pretty=format:'- %s' ${prev:+$prev..}$TAG | grep -v '^- Релиз v' || echo '- первый релиз'
            echo
            echo
            echo "**Установка:** Windows — скачай \`vaultboard-setup-${TAG#v}.exe\` ниже и запусти. Linux — \`vaultboard-${TAG#v}-x86_64.AppImage\`."
            echo 'У кого vaultboard уже стоит — новая версия скачается сама и поставится при выходе.'
          } > notes.md
          gh release create "$TAG" release/* --title "vaultboard $TAG" --notes-file notes.md
